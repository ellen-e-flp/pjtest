<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Pizza Tapper</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --green-dark: #2d5a27;
      --green-mid: #3a7a32;
      --green-light: #4caf50;
      --cream: #f5f0e8;
      --red: #e53935;
      --yellow: #ffd54f;
      --brown: #795548;
      --table-color: #8B6914;
      --table-light: #c49a2a;
    }

    body {
      background: var(--green-dark);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      font-family: 'Georgia', serif;
      overflow: hidden;
      touch-action: none;
    }

    #app {
      width: 100%;
      max-width: 420px;
      height: 100dvh;
      max-height: 900px;
      position: relative;
      overflow: hidden;
      background: linear-gradient(180deg, #2d5a27 0%, #3a7a32 100%);
    }

    /* ===== SCREENS ===== */
    .screen {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s;
    }
    .screen.active {
      opacity: 1;
      pointer-events: all;
    }

    /* ===== INSTRUCTION SCREEN ===== */
    #screen-intro {
      background: linear-gradient(180deg, #2d5a27 0%, #3a7a32 100%);
      justify-content: space-between;
      padding: 0 0 40px 0;
    }

    .intro-top {
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding-top: 60px;
      flex: 1;
    }

    .game-title {
      font-size: clamp(28px, 8vw, 38px);
      font-weight: 900;
      color: var(--cream);
      text-align: center;
      text-transform: uppercase;
      line-height: 1.1;
      letter-spacing: 1px;
      text-shadow: 2px 2px 0 rgba(0,0,0,0.3);
      margin-bottom: 16px;
    }

    .intro-desc {
      color: rgba(255,255,255,0.8);
      text-align: center;
      font-size: 14px;
      line-height: 1.6;
      max-width: 280px;
      margin-bottom: 40px;
    }

    .intro-chef {
      width: 180px;
      margin-top: auto;
    }

    .btn-play {
      background: var(--cream);
      color: var(--green-dark);
      border: none;
      border-radius: 30px;
      padding: 16px 60px;
      font-size: 18px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 2px;
      cursor: pointer;
      box-shadow: 0 4px 15px rgba(0,0,0,0.3);
      transition: transform 0.1s, box-shadow 0.1s;
    }
    .btn-play:active { transform: scale(0.96); box-shadow: 0 2px 8px rgba(0,0,0,0.3); }

    /* ===== GAME SCREEN ===== */
    #screen-game {
      background: linear-gradient(180deg, #2d5a27 0%, #3a7a32 100%);
      flex-direction: column;
      align-items: center;
    }

    #hud {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 20px 8px;
      color: var(--cream);
    }

    #level-badge {
      background: rgba(255,255,255,0.15);
      border-radius: 20px;
      padding: 6px 14px;
      font-size: 14px;
      font-weight: 700;
    }

    #score-badge {
      background: rgba(255,255,255,0.15);
      border-radius: 20px;
      padding: 6px 16px;
      font-size: 14px;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    #canvas-wrap {
      flex: 1;
      width: 100%;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    #gameCanvas {
      display: block;
      width: 100%;
      height: 100%;
    }

    #touch-overlay {
      position: absolute;
      inset: 0;
      display: flex;
    }
    .touch-zone {
      flex: 1;
      cursor: pointer;
    }

    /* ===== GAME OVER SCREEN ===== */
    #screen-gameover {
      background: linear-gradient(180deg, #2d5a27 0%, #3a7a32 100%);
      justify-content: center;
      align-items: center;
      gap: 24px;
      padding: 40px 30px;
    }

    .gameover-title {
      font-size: clamp(32px, 10vw, 42px);
      font-weight: 900;
      color: var(--cream);
      text-transform: uppercase;
      text-align: center;
      text-shadow: 2px 2px 0 rgba(0,0,0,0.3);
    }

    .gameover-score-box {
      background: rgba(255,255,255,0.1);
      border-radius: 20px;
      padding: 20px 50px;
      text-align: center;
      color: var(--cream);
    }
    .gameover-score-box .label { font-size: 14px; opacity: 0.7; }
    .gameover-score-box .value { font-size: 52px; font-weight: 900; }

    .gameover-high-box {
      background: rgba(255,255,255,0.07);
      border-radius: 20px;
      padding: 14px 40px;
      text-align: center;
      color: var(--cream);
    }
    .gameover-high-box .label { font-size: 12px; opacity: 0.6; }
    .gameover-high-box .value { font-size: 28px; font-weight: 700; }

    .gameover-chef {
      width: 120px;
    }
  </style>
</head>
<body>
<div id="app">

  <!-- INTRO SCREEN -->
  <div id="screen-intro" class="screen active">
    <div class="intro-top">
      <div class="game-title">Rollin' Rollin'<br>Keep On Rollin'</div>
      <p class="intro-desc">Tap left or right to move your chef and catch every ingredient rolling down the table. Don't miss or it's game over!</p>
      <canvas id="introChefCanvas" width="180" height="220" class="intro-chef"></canvas>
    </div>
    <button class="btn-play" id="btn-start">Play Game</button>
  </div>

  <!-- GAME SCREEN -->
  <div id="screen-game" class="screen">
    <div id="hud">
      <div id="level-badge">Level <span id="level-num">1</span></div>
      <div id="score-badge">🍕 <span id="score-num">0</span> / <span id="target-num">10</span></div>
    </div>
    <div id="canvas-wrap">
      <canvas id="gameCanvas"></canvas>
      <div id="touch-overlay">
        <div class="touch-zone" id="zone-left"></div>
        <div class="touch-zone" id="zone-right"></div>
      </div>
    </div>
  </div>

  <!-- GAME OVER SCREEN -->
  <div id="screen-gameover" class="screen">
    <div class="gameover-title">Game Over!</div>
    <canvas id="gameoverChefCanvas" width="120" height="150" class="gameover-chef"></canvas>
    <div class="gameover-score-box">
      <div class="label">Your Score</div>
      <div class="value" id="final-score">0</div>
    </div>
    <div class="gameover-high-box">
      <div class="label">Best</div>
      <div class="value" id="high-score">0</div>
    </div>
    <button class="btn-play" id="btn-restart">Play Again</button>
  </div>

</div>

<script src="game.js"></script>
</body>
</html>
